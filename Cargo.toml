[package]
name = "selenite"
version = "12.0.0-rc.1"
edition = "2021"
rust-version = "1.88"
description = "GPU-rendered multimedia workspace, Ruby IDE and raylib game development suite"
license = "MIT"

[[bin]]
name = "selenite"
path = "src/main.rs"

[[bin]]
name = "selenite-game"
path = "src/game_main.rs"
required-features = ["scripting"]

[features]
scripting = ["dep:magnus"]

[dependencies]
raylib = { version = "6.0", features = ["SUPPORT_IMAGE_GENERATION", "SUPPORT_FILEFORMAT_FLAC"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
image = "0.25"
magnus = { git = "https://github.com/matsadler/magnus", rev = "c08ca65b527e2cff2b347c46d3f8a029e17ca665", version = "0.10", features = ["embed"], optional = true }
arboard = "3.6.1"
reqwest = { version = "0.13.3", default-features = false, features = ["blocking", "rustls"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[workspace]
resolver = "2"
members = [
    "mic_freq",
]
default-members = [
    ".",
    "mic_freq",
]
