[package]
name = "mic_freq"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Measure the dominant frequency of microphone input and drive image assets with it (raylib + cpal + rustfft)"
license = "MIT"

[dependencies]
raylib = { version = "6.0", features = ["SUPPORT_IMAGE_GENERATION", "raygui"] }
cpal = "0.16"
rustfft = "6.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
