[package]
name = "mic_freq"
version = "6.0.0-rc.1"
edition = "2024"
rust-version = "1.88"
description = "Selenite microphone suite with voice-reactive PNGTuber artwork, pitch tuning, spectrum analysis and guided calibration"
license = "MIT"

[dependencies]
raylib = { version = "6.0", features = ["SUPPORT_IMAGE_GENERATION"] }
cpal = "0.16"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hound = "3.5"
lewton = "0.10"
midly = "0.5"
rustfft = "6.4"
rhai = "1.23"
